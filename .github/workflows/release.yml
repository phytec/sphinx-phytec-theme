name: release

on:
  push:
    tags: [ '[0-9]+.[0-9]+.[0-9]+' ]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build package
        run: |
          pip install build
          python -m build
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: sphinx-phytec-theme-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error

  create-release:
    runs-on: ubuntu-latest
    needs:
      - package
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: sphinx-phytec-theme-${{ github.ref_name }}
          path: dist
      - name: Create checksums
        run: |
          cd dist
          sha256sum * > ../sha256sum.txt
          cat ../sha256sum.txt
      - name: Construct changelog for this release
        run: |
          TAGS=$(git tag --list '[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n 2)
          CURRENT_TAG=${{ github.ref_name }}
          PREVIOUS_TAG=$(echo "$TAGS" | grep -vx "$CURRENT_TAG" | tail -n 1)
          if [ -n "$PREVIOUS_TAG" ]; then
            RANGE="$PREVIOUS_TAG..$CURRENT_TAG"
            echo "Changes since $PREVIOUS_TAG:" > changelog-$CURRENT_TAG.md
          else
            RANGE="$CURRENT_TAG"
            echo "Changes in $CURRENT_TAG:" > changelog-$CURRENT_TAG.md
          fi
          {
            echo
            echo '```'
            git shortlog --no-merges --format='%s' "$RANGE"
            echo '```'
          } >> changelog-$CURRENT_TAG.md
          cat changelog-$CURRENT_TAG.md
      - name: Deploy artifacts
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: sphinx-phytec-theme ${{ github.ref_name }}
          body_path: changelog-${{ github.ref_name }}.md
          files: |
            dist/*
            sha256sum.txt
